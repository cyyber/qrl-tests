# The single authoritative E2E workflow: manual runs, the nightly, and
# eventually go-qrl/qrysm callers all come through here. It resolves or builds
# the client images, runs one lane through `make e2e-run`, publishes the job
# summary, and uploads the reports tree (run manifest, summaries, lane
# reports, diagnostics).
name: e2e-reusable

on:
  workflow_call:
    inputs:
      qrl-tests-ref:
        description: qrl-tests ref to run (empty for the calling ref)
        type: string
        default: ""
      go-qrl-ref:
        description: go-qrl ref to build when no execution image is supplied
        type: string
        default: ""
      execution-image:
        description: immutable execution image reference (skips the go-qrl build)
        type: string
        default: ""
      clef-image:
        description: immutable Clef image reference
        type: string
        default: ""
      consensus-image:
        description: immutable consensus client image reference
        type: string
        default: ""
      validator-image:
        description: immutable validator client image reference
        type: string
        default: ""
      genesis-image:
        description: immutable genesis generator image reference
        type: string
        default: ""
      qrl-package-ref:
        description: qrl-package locator (empty for the pinned default)
        type: string
        default: ""
      source-qrysm:
        description: qrysm revision recorded in the run manifest
        type: string
        default: ""
      lane:
        description: E2E lane to run
        type: string
        default: execution-abi
      diagnostics:
        description: "network diagnostics collection: on-failure, always, or never"
        type: string
        default: on-failure
      runner:
        description: runner label the lane executes on
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: job budget for the whole lane
        type: number
        default: 60
      use-ecr:
        description: assume the CI role and log in to ECR before pulling images
        type: boolean
        default: false
    outputs:
      result:
        description: overall run result from reports/summary.json
        value: ${{ jobs.e2e.outputs.result }}
  workflow_dispatch:
    inputs:
      go-qrl-ref:
        description: go-qrl ref to build when no execution image is supplied
        type: string
        default: ""
      execution-image:
        description: immutable execution image reference (skips the go-qrl build)
        type: string
        default: ""
      clef-image:
        description: immutable Clef image reference
        type: string
        default: ""
      consensus-image:
        description: immutable consensus client image reference
        type: string
        default: ""
      validator-image:
        description: immutable validator client image reference
        type: string
        default: ""
      genesis-image:
        description: immutable genesis generator image reference
        type: string
        default: ""
      qrl-package-ref:
        description: qrl-package locator (empty for the pinned default)
        type: string
        default: ""
      lane:
        description: E2E lane to run
        type: string
        default: execution-abi
      diagnostics:
        description: "network diagnostics collection: on-failure, always, or never"
        type: string
        default: on-failure
      use-ecr:
        description: assume the CI role and log in to ECR before pulling images
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The Makefile preflight requires the 1.20.x CLI series.
  KURTOSIS_VERSION: 1.20.0

jobs:
  e2e:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 60 }}
    permissions:
      contents: read
      id-token: write # OIDC for the ECR login; unused when use-ecr is false
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.qrl-tests-ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The apt repository stopped receiving releases at 1.15.x; the pinned
      # tarballs from kurtosis-cli-release-artifacts are the current channel.
      - name: Install Kurtosis CLI
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64 sha256=8c5f50adbb27ca2d0693b9ac8643a148d55240cfdbc5b36fa8eef4b02325af16 ;;
            x86_64) arch=amd64 sha256=3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o kurtosis.tar.gz "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_${arch}.tar.gz"
          echo "${sha256}  kurtosis.tar.gz" | sha256sum -c -
          sudo tar -xzf kurtosis.tar.gz -C /usr/local/bin kurtosis
          rm kurtosis.tar.gz
          kurtosis analytics disable

      - name: Decode OIDC claims (temporary debug)
        if: ${{ inputs.use-ecr }}
        run: |
          payload=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value' | cut -d. -f2 | tr '_-' '/+')
          case $((${#payload} % 4)) in 2) payload="${payload}==" ;; 3) payload="${payload}=" ;; esac
          echo "$payload" | base64 -d | jq '{iss, aud, sub}'

      - name: Configure AWS credentials
        if: ${{ inputs.use-ecr }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: ${{ inputs.use-ecr }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check out go-qrl
        if: ${{ inputs.execution-image == '' && inputs.go-qrl-ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
          ref: ${{ inputs.go-qrl-ref }}
          path: .build/go-qrl

      - name: Build the execution image
        if: ${{ inputs.execution-image == '' && inputs.go-qrl-ref != '' }}
        run: docker build --tag local/go-qrl:devnet .build/go-qrl

      # Kurtosis pulls through its engine container, which does not share the
      # runner's registry login; pulling here parks the images in the local
      # daemon where the engine finds them without authenticating.
      - name: Pre-pull the configured images
        env:
          IMAGES: >-
            ${{ inputs.execution-image }}
            ${{ inputs.clef-image }}
            ${{ inputs.consensus-image }}
            ${{ inputs.validator-image }}
            ${{ inputs.genesis-image }}
        run: |
          for image in $IMAGES; do
            docker pull "$image"
          done

      - name: Record source revisions
        id: sources
        run: |
          if [ -d .build/go-qrl ]; then
            echo "go-qrl=$(git -C .build/go-qrl rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the lane
        env:
          E2E_LANE: ${{ inputs.lane }}
          E2E_DIAGNOSTICS: ${{ inputs.diagnostics }}
          DEVNET_EXECUTION_IMAGE: ${{ inputs.execution-image }}
          DEVNET_CLEF_IMAGE: ${{ inputs.clef-image }}
          DEVNET_CONSENSUS_IMAGE: ${{ inputs.consensus-image }}
          DEVNET_VALIDATOR_IMAGE: ${{ inputs.validator-image }}
          DEVNET_GENESIS_IMAGE: ${{ inputs.genesis-image }}
          DEVNET_QRL_PACKAGE_REF: ${{ inputs.qrl-package-ref }}
          # One enclave per run, attempt, and lane, so retried or concurrent
          # runs can never collide on the deterministic default name.
          DEVNET_ENCLAVE_NAME: qrl-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}
          E2E_SOURCE_GO_QRL: ${{ steps.sources.outputs.go-qrl }}
          E2E_SOURCE_QRYSM: ${{ inputs.source-qrysm }}
        run: make e2e-run

      - name: Publish the job summary
        if: ${{ always() }}
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## E2E result: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the verdict
        id: verdict
        if: ${{ always() }}
        run: |
          result=$(jq -r '.result // "failed"' reports/summary.json 2>/dev/null || echo failed)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Upload the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports-${{ inputs.lane }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
