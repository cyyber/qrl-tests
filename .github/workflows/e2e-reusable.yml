name: e2e-reusable

on:
  workflow_call:
    inputs:
      execution-image: &execution-image
        description: immutable execution image reference
        type: string
        required: true
      clef-image: &clef-image
        description: immutable Clef image reference
        type: string
        required: true
      consensus-image: &consensus-image
        description: immutable consensus client image reference
        type: string
        required: true
      validator-image: &validator-image
        description: immutable validator client image reference
        type: string
        required: true
      genesis-image: &genesis-image
        description: immutable genesis generator image reference
        type: string
        required: true
      qrysm-alltools-image: &qrysm-alltools-image
        description: immutable Qrysm all-tools image reference, for lanes that
          run Qrysm's command-line tools
        type: string
      source-go-qrl: &source-go-qrl
        description: go-qrl revision recorded in the run manifest
        type: string
      source-qrysm: &source-qrysm
        description: qrysm revision recorded in the run manifest
        type: string
      source-generator: &source-generator
        description: genesis generator revision recorded in the run manifest
        type: string
      lane: &lane
        description: E2E lane to run
        type: string
        default: execution
      timeout-minutes:
        description: job limit in minutes; covers the lane's timeout plus setup,
          network start, diagnostics and teardown
        type: number
        required: true
  workflow_dispatch:
    inputs:
      execution-image: *execution-image
      clef-image: *clef-image
      consensus-image: *consensus-image
      validator-image: *validator-image
      genesis-image: *genesis-image
      qrysm-alltools-image: *qrysm-alltools-image
      source-go-qrl: *source-go-qrl
      source-qrysm: *source-qrysm
      source-generator: *source-generator
      lane: *lane
      timeout-minutes:
        description: job limit in minutes; covers the lane's timeout plus setup,
          network start, diagnostics and teardown
        type: number
        default: 110
      seed:
        description: ginkgo spec-order seed (empty draws a fresh one per lane)
      runner:
        description: runner label the lane executes on; its architecture must
          match the supplied images
        default: ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  e2e:
    name: tests
    runs-on: ${{ inputs.runner || vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Kurtosis CLI
        uses: ./.github/actions/install-kurtosis

      # Sidecars do not pull their image. The network images are pulled by
      # Kurtosis, but nothing else brings the all-tools image to the runner.
      - name: Pull the all-tools image
        if: inputs.qrysm-alltools-image != ''
        env:
          QRYSM_ALLTOOLS_IMAGE: ${{ inputs.qrysm-alltools-image }}
        run: docker pull "${QRYSM_ALLTOOLS_IMAGE}"

      - name: Run the tests
        env:
          E2E_LANE: ${{ inputs.lane }}
          E2E_SEED: ${{ inputs.seed }}
          DEVNET_EXECUTION_IMAGE: ${{ inputs.execution-image }}
          DEVNET_CLEF_IMAGE: ${{ inputs.clef-image }}
          DEVNET_CONSENSUS_IMAGE: ${{ inputs.consensus-image }}
          DEVNET_VALIDATOR_IMAGE: ${{ inputs.validator-image }}
          DEVNET_GENESIS_IMAGE: ${{ inputs.genesis-image }}
          DEVNET_QRYSM_ALLTOOLS_IMAGE: ${{ inputs.qrysm-alltools-image }}
          # One enclave per run, attempt, and lane, so retried or concurrent
          # runs can never collide on the deterministic default name.
          DEVNET_ENCLAVE_NAME: qrl-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}
          E2E_SOURCE_GO_QRL: ${{ inputs.source-go-qrl }}
          E2E_SOURCE_QRYSM: ${{ inputs.source-qrysm }}
          E2E_SOURCE_GENERATOR: ${{ inputs.source-generator }}
        run: make e2e-run

      - name: Publish the job summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## E2E: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ inputs.lane }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14
