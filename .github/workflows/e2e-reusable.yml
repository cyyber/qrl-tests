name: e2e-reusable

on:
  workflow_call:
    inputs:
      execution-image:
        description: immutable execution image reference
        type: string
        required: true
      source-go-qrl:
        description: go-qrl revision recorded in the run manifest when the
          execution image arrives pre-built
        type: string
        default: ""
      clef-image:
        description: immutable Clef image reference
        type: string
        required: true
      consensus-image:
        description: immutable consensus client image reference
        type: string
        required: true
      validator-image:
        description: immutable validator client image reference
        type: string
        required: true
      genesis-image:
        description: immutable genesis generator image reference
        type: string
        required: true
      source-qrysm:
        description: qrysm revision recorded in the run manifest
        type: string
        default: ""
      source-generator:
        description: genesis generator revision recorded in the run manifest
        type: string
        default: ""
      lane:
        description: E2E lane to run
        type: string
        default: execution-abi
      diagnostics:
        description: "network diagnostics collection: on-failure, always, or never"
        type: string
        default: on-failure
      seed:
        description: ginkgo spec-order seed (empty draws a fresh one per lane)
        type: string
        default: ""
      runner:
        description: runner label the lane executes on; its architecture must
          match the supplied images
        type: string
        default: ubuntu-24.04-arm
      timeout-minutes:
        description: job budget for the whole lane
        type: number
        default: 60
  workflow_dispatch:
    inputs:
      execution-image:
        description: immutable execution image reference
        type: string
        required: true
      source-go-qrl:
        description: go-qrl revision recorded in the run manifest
        type: string
        default: ""
      clef-image:
        description: immutable Clef image reference
        type: string
        required: true
      consensus-image:
        description: immutable consensus client image reference
        type: string
        required: true
      validator-image:
        description: immutable validator client image reference
        type: string
        required: true
      genesis-image:
        description: immutable genesis generator image reference
        type: string
        required: true
      source-qrysm:
        description: qrysm revision recorded in the run manifest
        type: string
        default: ""
      source-generator:
        description: genesis generator revision recorded in the run manifest
        type: string
        default: ""
      lane:
        description: E2E lane to run
        type: string
        default: execution-abi
      diagnostics:
        description: "network diagnostics collection: on-failure, always, or never"
        type: string
        default: on-failure
      seed:
        description: ginkgo spec-order seed (empty draws a fresh one per lane)
        type: string
        default: ""
      runner:
        description: runner label the lane executes on; its architecture must
          match the supplied images
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

env:
  # The Makefile preflight requires the 1.20.x CLI series.
  KURTOSIS_VERSION: 1.20.0

jobs:
  e2e:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes || 60 }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The apt repository stopped receiving releases at 1.15.x; the pinned
      # tarballs from kurtosis-cli-release-artifacts are the current channel.
      - name: Install Kurtosis CLI
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64 sha256=8c5f50adbb27ca2d0693b9ac8643a148d55240cfdbc5b36fa8eef4b02325af16 ;;
            x86_64) arch=amd64 sha256=3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o kurtosis.tar.gz "https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/${KURTOSIS_VERSION}/kurtosis-cli_${KURTOSIS_VERSION}_linux_${arch}.tar.gz"
          echo "${sha256}  kurtosis.tar.gz" | sha256sum -c -
          sudo tar -xzf kurtosis.tar.gz -C /usr/local/bin kurtosis
          rm kurtosis.tar.gz
          kurtosis analytics disable

      - name: Run the tests
        env:
          E2E_LANE: ${{ inputs.lane }}
          E2E_DIAGNOSTICS: ${{ inputs.diagnostics }}
          E2E_SEED: ${{ inputs.seed }}
          DEVNET_EXECUTION_IMAGE: ${{ inputs.execution-image }}
          DEVNET_CLEF_IMAGE: ${{ inputs.clef-image }}
          DEVNET_CONSENSUS_IMAGE: ${{ inputs.consensus-image }}
          DEVNET_VALIDATOR_IMAGE: ${{ inputs.validator-image }}
          DEVNET_GENESIS_IMAGE: ${{ inputs.genesis-image }}
          # One enclave per run, attempt, and lane, so retried or concurrent
          # runs can never collide on the deterministic default name.
          DEVNET_ENCLAVE_NAME: qrl-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}
          E2E_SOURCE_GO_QRL: ${{ inputs.source-go-qrl }}
          E2E_SOURCE_QRYSM: ${{ inputs.source-qrysm }}
          E2E_SOURCE_GENERATOR: ${{ inputs.source-generator }}
        run: make e2e-run

      - name: Publish the job summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## E2E result: no summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ inputs.lane }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
