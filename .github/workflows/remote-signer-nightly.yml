name: remote-signer-nightly

# The remote-signer lanes, whose validator client signs every duty through
# go-remotesigner over TLS with the sign token, and in the mTLS lane with a
# client certificate as well. Neither the signer nor qrysm's remote signer
# client is published, so the job builds them from pinned commits with the
# lane's image scripts, and starts the network from a qrl-package checkout
# until the pinned qrl-package runs go-remotesigner.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      go-remotesigner-repository:
        description: go-remotesigner repository; empty uses
          vars.E2E_REMOTE_SIGNER_GO_REMOTESIGNER_REPOSITORY, else
          rgeraldes24/go-remotesigner
      go-remotesigner-ref:
        description: go-remotesigner branch, tag or full 40-character commit
          SHA; empty uses vars.E2E_REMOTE_SIGNER_GO_REMOTESIGNER_REF, else the
          pinned commit
      qrysm-repository:
        description: qrysm repository with the remote signer client; empty
          uses vars.E2E_REMOTE_SIGNER_QRYSM_REPOSITORY, else rgeraldes24/qrysm
      qrysm-ref:
        description: qrysm branch, tag or full 40-character commit SHA; empty
          uses vars.E2E_REMOTE_SIGNER_QRYSM_REF, else the pinned commit
      qrl-package-repository:
        description: qrl-package repository the network starts from; empty
          uses vars.E2E_REMOTE_SIGNER_QRL_PACKAGE_REPOSITORY, else
          rgeraldes24/qrl-package
      qrl-package-ref:
        description: qrl-package branch, tag or full 40-character commit SHA,
          or "pinned" for the qrl-package qrl-tests pins; empty uses
          vars.E2E_REMOTE_SIGNER_QRL_PACKAGE_REF, else the pinned commit
      lanes:
        description: JSON list of the remote-signer lanes to run; empty uses
          vars.E2E_REMOTE_SIGNER_LANES, else ["consensus-remote-signer"]
      seed:
        description: ginkgo spec-order seed (empty draws a fresh one per lane)
      runner:
        description: runner label every job executes on; empty uses
          vars.E2E_RUNNER, else ubuntu-24.04-arm

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The defaults, which the repository variables and then the inputs override.
  # Every step sees these, so their names must not be ones a step reads for
  # something else: the image scripts read REMOTESIGNER_REF and QRYSM_REF as
  # the commit to build, and the build steps set those to the commits the
  # images job resolved.
  GO_REMOTESIGNER_REPOSITORY: ${{ inputs.go-remotesigner-repository || vars.E2E_REMOTE_SIGNER_GO_REMOTESIGNER_REPOSITORY || 'rgeraldes24/go-remotesigner' }}
  GO_REMOTESIGNER_GIT_REF: ${{ inputs.go-remotesigner-ref || vars.E2E_REMOTE_SIGNER_GO_REMOTESIGNER_REF || '8447c2d29add5f52b5157038bc6b74bd0ecef36b' }}
  QRYSM_REPOSITORY: ${{ inputs.qrysm-repository || vars.E2E_REMOTE_SIGNER_QRYSM_REPOSITORY || 'rgeraldes24/qrysm' }}
  QRYSM_GIT_REF: ${{ inputs.qrysm-ref || vars.E2E_REMOTE_SIGNER_QRYSM_REF || '47f6b65e6c58bb8c268d3dfd94aca8cbd1718bcc' }}
  QRL_PACKAGE_REPOSITORY: ${{ inputs.qrl-package-repository || vars.E2E_REMOTE_SIGNER_QRL_PACKAGE_REPOSITORY || 'rgeraldes24/qrl-package' }}
  QRL_PACKAGE_GIT_REF: ${{ inputs.qrl-package-ref || vars.E2E_REMOTE_SIGNER_QRL_PACKAGE_REF || 'f68c0523e2b46f8afeaed4943361afed2f075df3' }}
  # The execution client and the genesis generator, from the nightly's
  # repositories and, unless a variable pins them, from main as the nightly
  # builds them; the generator with the nightly's qrysm, whose genesis the
  # remote signer client does not change.
  GO_QRL_REPOSITORY: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
  GO_QRL_GIT_REF: ${{ vars.E2E_REMOTE_SIGNER_GO_QRL_REF || 'main' }}
  GENERATOR_REPOSITORY: ${{ vars.E2E_GENERATOR_REPOSITORY || 'cyyber/qrl-genesis-generator' }}
  GENERATOR_GIT_REF: ${{ vars.E2E_REMOTE_SIGNER_GENERATOR_REF || 'main' }}
  GENERATOR_QRYSM_REPOSITORY: ${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}
  GENERATOR_QRYSM_GIT_REF: ${{ vars.E2E_REMOTE_SIGNER_GENERATOR_QRYSM_REF || 'main' }}

jobs:
  # Image and lane runners must use the same architecture.
  images:
    runs-on: ${{ inputs.runner || vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    # It pushes to the registry the nightly and the pruning share.
    concurrency:
      group: qrl-tests-ghcr
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      go-remotesigner-sha: ${{ steps.refs.outputs.go-remotesigner-sha }}
      qrysm-sha: ${{ steps.refs.outputs.qrysm-sha }}
      qrl-package-sha: ${{ steps.refs.outputs.qrl-package-sha }}
      go-qrl-sha: ${{ steps.refs.outputs.go-qrl-sha }}
      generator-sha: ${{ steps.refs.outputs.generator-sha }}
      generator-qrysm-sha: ${{ steps.refs.outputs.generator-qrysm-sha }}
      execution-image: ${{ steps.pin.outputs.execution-image }}
      genesis-image: ${{ steps.pin.outputs.genesis-image }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7

      # Every job builds and runs the same commits, even when a branch moves
      # during the run.
      - name: Resolve the source revisions
        id: refs
        run: |
          resolve() {
            if [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$2"
              return
            fi
            # A branch, else the commit a tag names; only a pattern that
            # ends in * lists the commit of an annotated tag. A remote
            # resolves no abbreviated commit.
            git ls-remote "https://github.com/$1" "refs/heads/$2" "refs/tags/$2*" | awk -v repository="$1" -v ref="$2" '
              $2 == "refs/heads/" ref { branch = $1 }
              $2 == "refs/tags/" ref { tag = $1 }
              $2 == "refs/tags/" ref "^{}" { peeled = $1 }
              END {
                sha = branch != "" ? branch : peeled != "" ? peeled : tag
                if (sha == "") {
                  print "cannot resolve " repository "@" ref ": no such branch or tag, and a commit must be its full 40-character SHA" > "/dev/stderr"
                  exit 1
                }
                print sha
              }'
          }
          go_remotesigner_sha=$(resolve "${GO_REMOTESIGNER_REPOSITORY}" "${GO_REMOTESIGNER_GIT_REF}")
          qrysm_sha=$(resolve "${QRYSM_REPOSITORY}" "${QRYSM_GIT_REF}")
          if [ "${QRL_PACKAGE_GIT_REF}" = pinned ]; then
            qrl_package_sha=pinned
          else
            qrl_package_sha=$(resolve "${QRL_PACKAGE_REPOSITORY}" "${QRL_PACKAGE_GIT_REF}")
          fi
          go_qrl_sha=$(resolve "${GO_QRL_REPOSITORY}" "${GO_QRL_GIT_REF}")
          generator_sha=$(resolve "${GENERATOR_REPOSITORY}" "${GENERATOR_GIT_REF}")
          generator_qrysm_sha=$(resolve "${GENERATOR_QRYSM_REPOSITORY}" "${GENERATOR_QRYSM_GIT_REF}")
          {
            echo "go-remotesigner-sha=${go_remotesigner_sha}"
            echo "qrysm-sha=${qrysm_sha}"
            echo "qrl-package-sha=${qrl_package_sha}"
            echo "go-qrl-sha=${go_qrl_sha}"
            echo "generator-sha=${generator_sha}"
            echo "generator-qrysm-sha=${generator_qrysm_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The execution client and the genesis generator are the nightly's
      # images, which it has usually built already; the lane jobs build the
      # signer and qrysm images.
      - name: Plan the image builds
        id: plan
        env:
          IMAGE_TARGETS: go-qrl,qrl-genesis-generator
          REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          GO_QRL_GIT_REPO: https://github.com/${{ env.GO_QRL_REPOSITORY }}.git
          GO_QRL_GIT_COMMIT: ${{ steps.refs.outputs.go-qrl-sha }}
          QRYSM_GIT_REPO: https://github.com/${{ env.GENERATOR_QRYSM_REPOSITORY }}.git
          QRYSM_GIT_COMMIT: ${{ steps.refs.outputs.generator-qrysm-sha }}
          GENERATOR_GIT_REPO: https://github.com/${{ env.GENERATOR_REPOSITORY }}.git
          GENERATOR_GIT_COMMIT: ${{ steps.refs.outputs.generator-sha }}
        run: ci/images/build.sh plan

      - name: Set up buildx
        if: steps.plan.outputs.bake-targets != ''
        uses: docker/setup-buildx-action@v4

      - name: Build the missing Bake images
        id: bake
        if: steps.plan.outputs.bake-targets != ''
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          files: ./ci/images/docker-bake.hcl
          targets: ${{ steps.plan.outputs.bake-targets }}
          push: true
          provenance: false

      - name: Pin the image digests
        id: pin
        env:
          IMAGE_TARGETS: go-qrl,qrl-genesis-generator
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: ci/images/build.sh pin

  e2e:
    name: ${{ matrix.lane }}
    needs: images
    runs-on: ${{ inputs.runner || vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
    # The lane's 25 minutes, the image builds, the network start, the
    # diagnostics and the teardown.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # consensus-remote-signer-mtls needs a qrl-package option that no
        # qrl-package has yet (e2e/README.md), so only the token lane runs
        # unless the variable or the input names the mTLS lane too.
        lane: ${{ fromJSON(inputs.lanes || vars.E2E_REMOTE_SIGNER_LANES || '["consensus-remote-signer"]') }}
    env:
      E2E_LANE: ${{ matrix.lane }}
      E2E_SEED: ${{ inputs.seed }}
      # The lane's profile; empty for a lane this workflow does not run.
      DEVNET_PROFILE: ${{ fromJSON('{"consensus-remote-signer":"remote-signer","consensus-remote-signer-mtls":"remote-signer-mtls"}')[matrix.lane] }}
      DEVNET_EXECUTION_IMAGE: ${{ needs.images.outputs.execution-image }}
      DEVNET_GENESIS_IMAGE: ${{ needs.images.outputs.genesis-image }}
      DEVNET_REMOTE_SIGNER_IMAGE: local/go-remotesigner:nightly
      DEVNET_CONSENSUS_IMAGE: local/qrysm:nightly-beacon-chain
      DEVNET_VALIDATOR_IMAGE: local/qrysm:nightly-validator
      # One enclave per run, attempt, and lane.
      DEVNET_ENCLAVE_NAME: qrl-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      E2E_SOURCE_REMOTESIGNER: ${{ needs.images.outputs.go-remotesigner-sha }}
      E2E_SOURCE_QRYSM: ${{ needs.images.outputs.qrysm-sha }}
      E2E_SOURCE_GO_QRL: ${{ needs.images.outputs.go-qrl-sha }}
      E2E_SOURCE_GENERATOR: ${{ needs.images.outputs.generator-sha }}
      GENERATOR_QRYSM_SHA: ${{ needs.images.outputs.generator-qrysm-sha }}
      QRL_PACKAGE_SHA: ${{ needs.images.outputs.qrl-package-sha }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7

      - name: Check out go-remotesigner
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GO_REMOTESIGNER_REPOSITORY }}
          ref: ${{ needs.images.outputs.go-remotesigner-sha }}
          path: .build/go-remotesigner
          # Its tags, once it has any, name the image's version.
          fetch-depth: 0

      - name: Check out qrysm
        uses: actions/checkout@v7
        with:
          repository: ${{ env.QRYSM_REPOSITORY }}
          ref: ${{ needs.images.outputs.qrysm-sha }}
          path: .build/qrysm

      - name: Check out qrl-package
        if: env.QRL_PACKAGE_SHA != 'pinned'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.QRL_PACKAGE_REPOSITORY }}
          ref: ${{ needs.images.outputs.qrl-package-sha }}
          path: .build/qrl-package

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .build/go-remotesigner/go.sum
            .build/qrysm/go.sum

      # Before the image builds, so that a lane the qrl-package cannot start
      # fails in seconds: qrl-package refuses a participant field it does not
      # know, and a profile sets only the fields it needs.
      - name: Check the lane's network parameters
        run: |
          if [ -z "${DEVNET_PROFILE}" ]; then
            echo "${E2E_LANE} is not a lane this workflow runs" >&2
            exit 1
          fi
          mkdir -p reports
          go run ./cmd/qrltest network params > reports/network-params.json
          sanity_check=.build/qrl-package/src/package_io/sanity_check.star
          if [ "${QRL_PACKAGE_SHA}" = pinned ]; then
            exit 0
          elif [ ! -f "${sanity_check}" ]; then
            echo "::warning::${sanity_check} is gone: the participant fields are not checked"
            exit 0
          fi
          status=0
          for field in $(jq -r '[.participants[] | keys[]] | unique[]' reports/network-params.json); do
            if ! grep -Fq "\"${field}\"" "${sanity_check}"; then
              echo "::error::${QRL_PACKAGE_REPOSITORY}@${QRL_PACKAGE_SHA} does not take the participant field ${field}, which the ${DEVNET_PROFILE} profile sets"
              status=1
            fi
          done
          exit "${status}"

      - name: Install Kurtosis CLI
        uses: ./.github/actions/install-kurtosis

      # The scripts export the commit with git archive, so the image is built
      # from the commit the images job resolved, whatever ref named it.
      - name: Build the go-remotesigner image
        env:
          REMOTESIGNER_SOURCE_DIR: .build/go-remotesigner
          REMOTESIGNER_REF: ${{ needs.images.outputs.go-remotesigner-sha }}
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          GO_LICENSES="$(go env GOPATH)/bin/go-licenses" make remote-signer-image

      - name: Build the qrysm images
        env:
          QRYSM_SOURCE_DIR: .build/qrysm
          QRYSM_REF: ${{ needs.images.outputs.qrysm-sha }}
        run: make qrysm-images

      - name: Start the network from the qrl-package checkout
        if: env.QRL_PACKAGE_SHA != 'pinned'
        run: |
          make network-preflight
          kurtosis enclave add --name "${DEVNET_ENCLAVE_NAME}"
          kurtosis run --enclave "${DEVNET_ENCLAVE_NAME}" ./.build/qrl-package --args-file reports/network-params.json

      - name: Run the tests
        if: env.QRL_PACKAGE_SHA != 'pinned'
        run: make e2e

      # The runner starts the network itself, diagnoses a failed lane, and
      # removes the network.
      - name: Run the tests on the pinned qrl-package
        if: env.QRL_PACKAGE_SHA == 'pinned'
        run: make e2e-run

      # make e2e diagnoses a failed lane; a network that failed to start, or
      # a job that was cancelled or timed out, never got that far. The dump
      # holds every service's log and container spec, and the files
      # artifacts, which are left out: they hold the keystores, their
      # password, the sign token and the TLS keys. The signer's metrics
      # listener is plain HTTP and takes no credential.
      - name: Collect the network diagnostics
        if: ${{ !success() && env.QRL_PACKAGE_SHA != 'pinned' }}
        run: |
          if kurtosis enclave inspect "${DEVNET_ENCLAVE_NAME}" > /dev/null 2>&1; then
            mkdir -p reports
            kurtosis enclave inspect "${DEVNET_ENCLAVE_NAME}" > reports/enclave-inspection.txt 2>&1 || true
            kurtosis enclave dump "${DEVNET_ENCLAVE_NAME}" reports/enclave-dump || true
            rm -rf reports/enclave-dump/files
            awk '/User Services/ { services = 1; next } services && $2 ~ /^signer-/ { print $2 }' reports/enclave-inspection.txt |
              while read -r service; do
                url=$(kurtosis port print "${DEVNET_ENCLAVE_NAME}" "${service}" metrics 2> /dev/null) || continue
                case "${url}" in
                  *://*) ;;
                  *) url=http://${url} ;;
                esac
                curl -fsS --max-time 10 -o "reports/${service}-metrics.txt" "${url}/metrics" || true
              done
          fi

      - name: Stop the network
        if: always() && env.QRL_PACKAGE_SHA != 'pinned'
        run: |
          if kurtosis enclave inspect "${DEVNET_ENCLAVE_NAME}" > /dev/null 2>&1; then
            make network-stop
          fi

      # The sources go into the reports as well, since the run manifest has
      # neither the qrl-package of a network started here nor the qrysm the
      # genesis generator was built with.
      - name: Publish the job summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "## ${E2E_LANE} sources"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| ${GO_REMOTESIGNER_REPOSITORY} | ${E2E_SOURCE_REMOTESIGNER} |"
            echo "| ${QRYSM_REPOSITORY} | ${E2E_SOURCE_QRYSM} |"
            echo "| ${GO_QRL_REPOSITORY} | ${E2E_SOURCE_GO_QRL} |"
            echo "| ${GENERATOR_REPOSITORY} | ${E2E_SOURCE_GENERATOR} |"
            echo "| ${GENERATOR_QRYSM_REPOSITORY}, the genesis generator's | ${GENERATOR_QRYSM_SHA} |"
            if [ "${QRL_PACKAGE_SHA}" = pinned ]; then
              echo "| qrl-package | the qrl-package qrl-tests pins |"
            else
              echo "| ${QRL_PACKAGE_REPOSITORY} | ${QRL_PACKAGE_SHA} |"
            fi
            echo "| ${GITHUB_REPOSITORY} | ${GITHUB_SHA} |"
          } > reports/sources.md
          {
            cat reports/sources.md
            echo
            if [ -f reports/summary.md ]; then
              cat reports/summary.md
            else
              echo "## E2E: no summary produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The sources, the run manifest and Ginkgo report; on a failure also
      # the services' logs and inspection, and the signer's metrics,
      # healthcheck and capabilities for every failed spec; on a failure
      # before the tests, a cancellation or a timeout, the enclave dump and
      # the signer's metrics.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ matrix.lane }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 14

  image-failure-summary:
    needs: images
    if: ${{ always() && needs.images.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the result
        env:
          IMAGE_RESULT: ${{ needs.images.result }}
        run: |
          {
            echo "## E2E: not run"
            echo
            echo "Image preparation ${IMAGE_RESULT}."
          } >> "$GITHUB_STEP_SUMMARY"
