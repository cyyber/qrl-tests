# Nightly E2E: resolve the latest client revisions, run every nightly lane
# through the reusable workflow, and publish one combined result. Exact
# revisions and image references land in each lane's run-manifest.json; to
# reproduce a night, dispatch e2e-reusable with the recorded values.
name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      go-qrl-ref:
        description: go-qrl ref to build and test
        type: string
        default: main

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      go-qrl-sha: ${{ steps.refs.outputs.go-qrl-sha }}
      qrysm-sha: ${{ steps.refs.outputs.qrysm-sha }}
      generator-sha: ${{ steps.refs.outputs.generator-sha }}
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      # Every source repository resolves to its upstream tip; only base
      # images and builders stay pinned, in ci/images/sources.env.
      - name: Resolve the source revisions
        id: refs
        env:
          GO_QRL_REPOSITORY: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
          QRYSM_REPOSITORY: ${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}
          GENERATOR_REPOSITORY: ${{ vars.E2E_GENERATOR_REPOSITORY || 'cyyber/qrl-genesis-generator' }}
          GO_QRL_REF: ${{ inputs.go-qrl-ref || 'main' }}
        run: |
          resolve() {
            local sha
            sha=$(git ls-remote "https://github.com/$1" "refs/heads/$2" | cut -f1)
            test -n "$sha" || { echo "cannot resolve $1@$2" >&2; exit 1; }
            echo "$sha"
          }
          {
            echo "go-qrl-sha=$(resolve "${GO_QRL_REPOSITORY}" "${GO_QRL_REF}")"
            echo "qrysm-sha=$(resolve "${QRYSM_REPOSITORY}" main)"
            echo "generator-sha=$(resolve "${GENERATOR_REPOSITORY}" main)"
          } >> "$GITHUB_OUTPUT"

      - name: Select the nightly lanes
        id: lanes
        env:
          # A JSON array in the E2E_NIGHTLY_LANES repository variable; new
          # lanes join the nightly by registration, not by workflow edits.
          LANES: ${{ vars.E2E_NIGHTLY_LANES || '["execution-abi"]' }}
        run: echo "lanes=${LANES}" >> "$GITHUB_OUTPUT"

  # Every devnet image is built from source, content-addressed by its exact
  # inputs, and cached in the repository owner's GHCR namespace: a tag that
  # already exists is reused, anything else is built and pushed. The node and
  # Clef images track the resolved go-qrl revision; the qrysm and genesis
  # images build from the pins in ci/images/sources.env. The runner label
  # must stay in lockstep with the lane jobs so image and runner
  # architectures match.
  images:
    needs: resolve
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      execution-image: ${{ steps.build.outputs.execution-image }}
      clef-image: ${{ steps.build.outputs.clef-image }}
      consensus-image: ${{ steps.build.outputs.consensus-image }}
      validator-image: ${{ steps.build.outputs.validator-image }}
      genesis-image: ${{ steps.build.outputs.genesis-image }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v5

      - name: Check out go-qrl
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
          ref: ${{ needs.resolve.outputs.go-qrl-sha }}
          path: .build/go-qrl

      - name: Install crane
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64 sha256=fc0515857bc38e4ddd2d37a5ab03fb5959449c7b2d4ad759bcc1174ac0cad91b ;;
            x86_64) arch=x86_64 sha256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_${arch}.tar.gz"
          echo "${sha256}  crane.tar.gz" | sha256sum -c -
          sudo tar -xzf crane.tar.gz -C /usr/local/bin crane
          rm crane.tar.gz

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The registry-backed layer cache needs the docker-container driver;
      # the default docker driver cannot export cache to a registry.
      - name: Set up buildx
        run: docker buildx create --use --name e2e-images

      - name: Build or reuse the images
        id: build
        env:
          REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          GO_QRL_DIR: .build/go-qrl
          QRYSM_GIT_REPO: https://github.com/${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}.git
          QRYSM_GIT_COMMIT: ${{ needs.resolve.outputs.qrysm-sha }}
          GENERATOR_GIT_REPO: https://github.com/${{ vars.E2E_GENERATOR_REPOSITORY || 'cyyber/qrl-genesis-generator' }}.git
          GENERATOR_GIT_COMMIT: ${{ needs.resolve.outputs.generator-sha }}
        run: ci/images/build.sh

  e2e:
    needs: [resolve, images]
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.resolve.outputs.lanes) }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      # Immutable digest references from the images job; repository variables
      # override any of them without a code change. Source revisions are only
      # recorded for images this run actually built — an override severs the
      # link between image and resolved revision, so recording the sha would
      # fabricate provenance.
      execution-image: ${{ vars.E2E_EXECUTION_IMAGE || needs.images.outputs.execution-image }}
      source-go-qrl: ${{ vars.E2E_EXECUTION_IMAGE == '' && needs.resolve.outputs.go-qrl-sha || '' }}
      clef-image: ${{ vars.E2E_CLEF_IMAGE || needs.images.outputs.clef-image }}
      consensus-image: ${{ vars.E2E_CONSENSUS_IMAGE || needs.images.outputs.consensus-image }}
      validator-image: ${{ vars.E2E_VALIDATOR_IMAGE || needs.images.outputs.validator-image }}
      genesis-image: ${{ vars.E2E_GENESIS_IMAGE || needs.images.outputs.genesis-image }}
      source-qrysm: ${{ vars.E2E_CONSENSUS_IMAGE == '' && vars.E2E_VALIDATOR_IMAGE == '' && needs.resolve.outputs.qrysm-sha || '' }}
      lane: ${{ matrix.lane }}
      runner: ${{ vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
      timeout-minutes: 90

  report:
    needs: [resolve, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the combined result
        env:
          RESULT: ${{ needs.e2e.result }}
          GO_QRL_SHA: ${{ needs.resolve.outputs.go-qrl-sha }}
          QRYSM_SHA: ${{ needs.resolve.outputs.qrysm-sha }}
          LANES: ${{ needs.resolve.outputs.lanes }}
        run: |
          {
            echo "# Nightly E2E: ${RESULT}"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| go-qrl | \`${GO_QRL_SHA}\` |"
            echo "| qrysm | \`${QRYSM_SHA}\` |"
            echo "| qrl-tests | \`${GITHUB_SHA}\` |"
            echo
            echo "Lanes: \`${LANES}\` — per-lane manifests and diagnostics are in each lane's reports artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = "success"
