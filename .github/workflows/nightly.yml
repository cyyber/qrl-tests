# Nightly E2E: resolve the latest client revisions and run every nightly lane
# through the reusable workflow. Exact revisions and image references land in
# each lane's run-manifest.json; to reproduce a night, dispatch e2e-reusable
# with the recorded values.
name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      go-qrl-ref:
        description: go-qrl ref to build and test
        type: string
        default: main

permissions:
  contents: read

jobs:
  # One job decides and provides what tonight tests: it resolves every
  # source repository to its upstream tip (only base images and builders
  # stay pinned, in ci/images/sources.env), selects the lane list, and
  # builds or reuses every devnet image — content-addressed by sources,
  # recipe, and architecture in the repository owner's GHCR namespace, where
  # a tag that already exists is reused and anything else is built and
  # pushed. The runner label must stay in lockstep with the lane jobs so
  # image and runner architectures match.
  images:
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      go-qrl-sha: ${{ steps.refs.outputs.go-qrl-sha }}
      qrysm-sha: ${{ steps.refs.outputs.qrysm-sha }}
      generator-sha: ${{ steps.refs.outputs.generator-sha }}
      execution-image: ${{ steps.build.outputs.execution-image }}
      clef-image: ${{ steps.build.outputs.clef-image }}
      consensus-image: ${{ steps.build.outputs.consensus-image }}
      validator-image: ${{ steps.build.outputs.validator-image }}
      genesis-image: ${{ steps.build.outputs.genesis-image }}
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7

      - name: Resolve the source revisions
        id: refs
        env:
          GO_QRL_REPOSITORY: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
          QRYSM_REPOSITORY: ${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}
          GENERATOR_REPOSITORY: ${{ vars.E2E_GENERATOR_REPOSITORY || 'cyyber/qrl-genesis-generator' }}
          GO_QRL_REF: ${{ inputs.go-qrl-ref || 'main' }}
        run: |
          resolve() {
            local sha
            sha=$(git ls-remote "https://github.com/$1" "refs/heads/$2" | cut -f1)
            test -n "$sha" || { echo "cannot resolve $1@$2" >&2; exit 1; }
            echo "$sha"
          }
          {
            echo "go-qrl-sha=$(resolve "${GO_QRL_REPOSITORY}" "${GO_QRL_REF}")"
            echo "qrysm-sha=$(resolve "${QRYSM_REPOSITORY}" main)"
            echo "generator-sha=$(resolve "${GENERATOR_REPOSITORY}" main)"
          } >> "$GITHUB_OUTPUT"

      - name: Install crane
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64 sha256=fc0515857bc38e4ddd2d37a5ab03fb5959449c7b2d4ad759bcc1174ac0cad91b ;;
            x86_64) arch=x86_64 sha256=c1d593d01551f2c9a3df5ca0a0be4385a839bd9b86d4a76e18d7b17d16559127 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_${arch}.tar.gz"
          echo "${sha256}  crane.tar.gz" | sha256sum -c -
          sudo tar -xzf crane.tar.gz -C /usr/local/bin crane
          rm crane.tar.gz

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The registry-backed layer cache needs the docker-container driver;
      # the default docker driver cannot export cache to a registry.
      - name: Set up buildx
        run: docker buildx create --use --name e2e-images

      - name: Build or reuse the images
        id: build
        env:
          REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}
          GO_QRL_GIT_REPO: https://github.com/${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}.git
          GO_QRL_GIT_COMMIT: ${{ steps.refs.outputs.go-qrl-sha }}
          QRYSM_GIT_REPO: https://github.com/${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}.git
          QRYSM_GIT_COMMIT: ${{ steps.refs.outputs.qrysm-sha }}
          GENERATOR_GIT_REPO: https://github.com/${{ vars.E2E_GENERATOR_REPOSITORY || 'cyyber/qrl-genesis-generator' }}.git
          GENERATOR_GIT_COMMIT: ${{ steps.refs.outputs.generator-sha }}
        run: ci/images/build.sh

  e2e:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(vars.E2E_NIGHTLY_LANES || '["execution-abi"]') }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      # Immutable digest references from the images job.
      execution-image: ${{ needs.images.outputs.execution-image }}
      source-go-qrl: ${{ needs.images.outputs.go-qrl-sha }}
      clef-image: ${{ needs.images.outputs.clef-image }}
      consensus-image: ${{ needs.images.outputs.consensus-image }}
      validator-image: ${{ needs.images.outputs.validator-image }}
      genesis-image: ${{ needs.images.outputs.genesis-image }}
      source-qrysm: ${{ needs.images.outputs.qrysm-sha }}
      source-generator: ${{ needs.images.outputs.generator-sha }}
      lane: ${{ matrix.lane }}
      runner: ${{ vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
      timeout-minutes: 90
