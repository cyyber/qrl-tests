name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: qrl-tests-ghcr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/images-reusable.yml
    permissions:
      contents: read
      packages: write

  e2e:
    name: ${{ matrix.lane }}
    needs: images
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(vars.E2E_NIGHTLY_LANES || '["execution", "consensus-staking-automated", "consensus-staking-operator", "resilience-network-restart", "sync"]') }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      # Immutable digest references from the images job.
      execution-image: ${{ needs.images.outputs.execution-image }}
      clef-image: ${{ needs.images.outputs.clef-image }}
      consensus-image: ${{ needs.images.outputs.consensus-image }}
      validator-image: ${{ needs.images.outputs.validator-image }}
      # Only this lane runs Qrysm's command-line tools.
      qrysm-alltools-image: ${{ matrix.lane == 'consensus-staking-operator' && needs.images.outputs.qrysm-alltools-image || '' }}
      genesis-image: ${{ needs.images.outputs.genesis-image }}
      source-go-qrl: ${{ needs.images.outputs.go-qrl-sha }}
      source-qrysm: ${{ needs.images.outputs.qrysm-sha }}
      source-generator: ${{ needs.images.outputs.generator-sha }}
      lane: ${{ matrix.lane }}
      timeout-minutes: ${{ fromJSON('{"execution":30,"consensus-staking-automated":110,"consensus-staking-operator":110,"resilience-network-restart":40,"sync":75}')[matrix.lane] }}

  image-failure-summary:
    needs: images
    if: ${{ always() && needs.images.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the result
        env:
          IMAGE_RESULT: ${{ needs.images.result }}
        run: |
          {
            echo "## E2E: not run"
            echo
            echo "Image preparation ${IMAGE_RESULT}."
          } >> "$GITHUB_STEP_SUMMARY"
