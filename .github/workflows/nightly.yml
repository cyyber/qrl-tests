# Nightly E2E: resolve the latest client revisions, run every nightly lane
# through the reusable workflow, and publish one combined result. Exact
# revisions and image references land in each lane's run-manifest.json; to
# reproduce a night, dispatch e2e-reusable with the recorded values.
name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      go-qrl-ref:
        description: go-qrl ref to build and test
        type: string
        default: main

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      go-qrl-sha: ${{ steps.refs.outputs.go-qrl-sha }}
      qrysm-sha: ${{ steps.refs.outputs.qrysm-sha }}
      lanes: ${{ steps.lanes.outputs.lanes }}
    steps:
      - name: Resolve the client revisions
        id: refs
        env:
          GO_QRL_REPOSITORY: ${{ vars.E2E_GO_QRL_REPOSITORY || 'cyyber/go-qrl' }}
          QRYSM_REPOSITORY: ${{ vars.E2E_QRYSM_REPOSITORY || 'cyyber/qrysm' }}
          GO_QRL_REF: ${{ inputs.go-qrl-ref || 'main' }}
        run: |
          go_qrl=$(git ls-remote "https://github.com/${GO_QRL_REPOSITORY}" "refs/heads/${GO_QRL_REF}" | cut -f1)
          test -n "$go_qrl" || { echo "cannot resolve ${GO_QRL_REPOSITORY}@${GO_QRL_REF}" >&2; exit 1; }
          qrysm=$(git ls-remote "https://github.com/${QRYSM_REPOSITORY}" refs/heads/main | cut -f1)
          echo "go-qrl-sha=${go_qrl}" >> "$GITHUB_OUTPUT"
          echo "qrysm-sha=${qrysm}" >> "$GITHUB_OUTPUT"

      - name: Select the nightly lanes
        id: lanes
        env:
          # A JSON array in the E2E_NIGHTLY_LANES repository variable; new
          # lanes join the nightly by registration, not by workflow edits.
          LANES: ${{ vars.E2E_NIGHTLY_LANES || '["execution-abi"]' }}
        run: echo "lanes=${LANES}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.resolve.outputs.lanes) }}
    uses: ./.github/workflows/e2e-reusable.yml
    with:
      go-qrl-ref: ${{ needs.resolve.outputs.go-qrl-sha }}
      # The fallback images are public, digest-pinned, and linux/arm64 only,
      # which is why the fallback runner must stay an arm64 label. Repository
      # variables override every one of them without a code change.
      clef-image: ${{ vars.E2E_CLEF_IMAGE || 'ghcr.io/rgeraldes24/go-qrl-clef@sha256:ed859e8bde23914c09e96b7b24dbfaf41eebd8df8850243c704a8b1227129a42' }}
      consensus-image: ${{ vars.E2E_CONSENSUS_IMAGE || 'ghcr.io/rgeraldes24/qrysm-beacon@sha256:23eee233b54841f379482c3f2f0877532aad54627ed8a0f96ef91bd2893c50a0' }}
      validator-image: ${{ vars.E2E_VALIDATOR_IMAGE || 'ghcr.io/rgeraldes24/qrysm-validator@sha256:4bcdf29ad52fef3f5e7ed0d5859b1f2c4c5b33e15606d222afacccc2bd695b20' }}
      genesis-image: ${{ vars.E2E_GENESIS_IMAGE || 'ghcr.io/rgeraldes24/qrl-genesis-generator@sha256:890aa49d68098376cdf9fbf257c1ec4e1f88e8fbcf36065d5dff36dd945bae25' }}
      source-qrysm: ${{ needs.resolve.outputs.qrysm-sha }}
      lane: ${{ matrix.lane }}
      runner: ${{ vars.E2E_RUNNER || 'ubuntu-24.04-arm' }}
      timeout-minutes: 90

  report:
    needs: [resolve, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the combined result
        env:
          RESULT: ${{ needs.e2e.result }}
          GO_QRL_SHA: ${{ needs.resolve.outputs.go-qrl-sha }}
          QRYSM_SHA: ${{ needs.resolve.outputs.qrysm-sha }}
          LANES: ${{ needs.resolve.outputs.lanes }}
        run: |
          {
            echo "# Nightly E2E: ${RESULT}"
            echo
            echo "| Source | Revision |"
            echo "| --- | --- |"
            echo "| go-qrl | \`${GO_QRL_SHA}\` |"
            echo "| qrysm | \`${QRYSM_SHA}\` |"
            echo "| qrl-tests | \`${GITHUB_SHA}\` |"
            echo
            echo "Lanes: \`${LANES}\` — per-lane manifests and diagnostics are in each lane's reports artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = "success"

      # Failures are pushed to Discord; a missing webhook downgrades this to
      # a no-op so forks and callers without the secret stay green.
      - name: Notify Discord of the failure
        if: ${{ always() && needs.e2e.result != 'success' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_E2E_WEBHOOK }}
          RESULT: ${{ needs.e2e.result }}
          GO_QRL_SHA: ${{ needs.resolve.outputs.go-qrl-sha }}
          QRYSM_SHA: ${{ needs.resolve.outputs.qrysm-sha }}
          LANES: ${{ needs.resolve.outputs.lanes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_E2E_WEBHOOK is not configured; skipping the notification"
            exit 0
          fi
          jq -n '{
            embeds: [{
              title: "Nightly E2E: \(env.RESULT)",
              url: env.RUN_URL,
              color: 15158332,
              fields: [
                {name: "go-qrl", value: env.GO_QRL_SHA, inline: true},
                {name: "qrysm", value: env.QRYSM_SHA, inline: true},
                {name: "qrl-tests", value: env.GITHUB_SHA, inline: true},
                {name: "lanes", value: env.LANES}
              ],
              footer: {text: "Reports and diagnostics are attached to the run as artifacts."}
            }]
          }' | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
