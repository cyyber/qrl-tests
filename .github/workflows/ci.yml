name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run the Go tests
        run: go test ./...

      - name: Compile the E2E suites
        run: go test -tags=e2e -run '^$' ./e2e/...

      - name: Run the Go linter
        run: make lint

      - name: Run ShellCheck
        run: shellcheck ci/images/*.sh

      - name: Validate the Bake definition
        run: |
          docker buildx bake \
            -f ci/images/docker-bake.hcl \
            -f ci/images/qrl-genesis-generator.hcl \
            --print \
            go-qrl go-qrl-clef qrl-genesis-generator
