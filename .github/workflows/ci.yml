name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out qrl-tests
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run the Go tests
        run: go test ./...

      - name: Compile the E2E suites
        run: go test -tags=e2e -run '^$' ./e2e/...

      - name: Run the Go linter
        run: make lint

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" \
            -ignore 'property "workflow_repository" is not defined in object type' \
            -ignore 'property "workflow_sha" is not defined in object type'

      - name: Run ShellCheck
        run: shellcheck ci/images/*.sh

      - name: Validate the Bake definition
        run: docker buildx bake -f ci/images/docker-bake.hcl --print
