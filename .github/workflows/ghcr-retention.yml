# Content-addressed tags accumulate one version per tested revision. Keep a
# recent window of versions per package; anything still in use is always
# inside the window, because a tag only stops being rebuilt when its inputs
# change, and a tag's referenced manifests enter the registry together so
# whole graphs age out of the window together.
#
# Deliberately NO untagged-only deletion: buildx provenance attaches
# untagged child manifests to tagged indexes, and deleting the children
# leaves the tag unpullable (actions/delete-package-versions#162). Builds
# now disable provenance, but manifests pushed before that must never be
# corrupted retroactively.
name: ghcr-retention

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - go-qrl
          - go-qrl-clef
          - qrysm-beacon
          - qrysm-validator
          - qrl-genesis-generator
    steps:
      - name: Keep only the newest window
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 60
