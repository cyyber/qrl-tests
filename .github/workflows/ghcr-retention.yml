name: ghcr-retention

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

concurrency:
  group: qrl-tests-ghcr
  cancel-in-progress: false

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package:
          - go-qrl
          - go-qrl-clef
          - qrysm-beacon
          - qrysm-validator
          - qrl-genesis-generator
    steps:
      - name: Keep only the newest window
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 50
